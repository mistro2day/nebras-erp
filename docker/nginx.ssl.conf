events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    upstream backend_servers {
        server backend:8000;
    }

    # إعادة توجيه HTTP إلى HTTPS
    server {
        listen 80;
        server_name nebraserp.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # إعدادات HTTPS الآمنة
    server {
        listen 443 ssl http2;
        server_name nebraserp.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/nebraserp.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nebraserp.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Frontend SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Django Static files
        location /static/ {
            alias /app/staticfiles/;
        }

        # Django Media files
        location /media/ {
            alias /app/media/;
        }

        # Django API & Admin
        location ~ ^/(api|admin)/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WhatsApp Evolution API Proxy
        location /whatsapp-api/ {
            proxy_pass http://172.17.0.1:8050/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header apikey nebras_evo_secret_key_2026;
        }
    }
}
